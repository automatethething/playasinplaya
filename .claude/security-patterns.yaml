patterns:
  - rule_name: possible_hardcoded_secret
    substrings:
      - "sk_live_"
      - "AKIA"
      - "CONSENTKEYS_CLIENT_SECRET"
      - "SUPABASE_SERVICE_ROLE_KEY"
      - "PAYRAILS_API_KEY"
      - "PAYRAILS_WEBHOOK_SECRET"
      - "POSTHOG_PERSONAL_API_KEY"
    reminder: "Possible hardcoded secret. Load credentials from environment or secret manager; never commit real secrets."

  - rule_name: direct_stripe_usage
    substrings:
      - "from 'stripe'"
      - 'from "stripe"'
      - "require('stripe')"
      - 'require("stripe")'
      - "new Stripe("
    reminder: "Flowstate apps must not use Stripe directly. Use Petrichor Labs PayRails."

  - rule_name: service_role_in_client_surface
    regex: "SUPABASE_SERVICE_ROLE_KEY|service_role"
    paths:
      - "**/src/app/**"
      - "**/src/components/**"
      - "**/src/hooks/**"
      - "**/public/**"
    reminder: "Service-role credentials must stay server-side only and must not reach client bundles or public assets."

  - rule_name: unsafe_dom_write
    substrings:
      - "dangerouslySetInnerHTML"
      - ".innerHTML ="
      - "document.write"
      - "insertAdjacentHTML"
    reminder: "Unsafe DOM write. Confirm content is trusted and sanitized; avoid rendering user-controlled HTML."

  - rule_name: shell_exec
    substrings:
      - "child_process.exec"
      - "execSync("
      - "spawnSync("
      - "os.system("
    reminder: "Command execution is security-sensitive. Never pass raw user input to shell commands."

  - rule_name: unsafe_eval
    substrings:
      - "eval("
      - "new Function("
    reminder: "Dynamic code execution is almost never acceptable. Remove it or prove the input is trusted and constrained."

  - rule_name: authenticated_cache_risk
    substrings:
      - "caches.open"
      - "cache.put"
      - "Cache-Control"
    paths:
      - "**/sw.js"
      - "**/serviceWorker.ts"
      - "**/middleware.ts"
      - "**/route.ts"
    reminder: "Do not cache authenticated API responses or private user data. PWA installability does not require private-data offline caching."

  - rule_name: wildcard_cors
    substrings:
      - "Access-Control-Allow-Origin: *"
      - "'Access-Control-Allow-Origin': '*'"
      - '"Access-Control-Allow-Origin": "*"'
    reminder: "Wildcard CORS is risky. Use explicit allowed origins unless this endpoint is intentionally public and read-only."

  - rule_name: raw_authorization_logging
    regex: "console\\.(log|info|warn|error)\\([^\\n]*(authorization|cookie|access_token|refresh_token|id_token|session|code_verifier|nonce)"
    reminder: "Do not log auth headers, cookies, sessions, OAuth verifier/nonce/state, or bearer tokens. Redact before logging."

  - rule_name: unscoped_database_select
    regex: "\\.from\\([^)]*\\)\\s*\\.select\\([^)]*\\)(?![\\s\\S]{0,250}\\.(eq|match|filter)\\()"
    paths:
      - "**/src/app/api/**/route.ts"
      - "**/src/lib/**"
    reminder: "Check for unscoped database reads. Private/user data queries need ownership, namespace, or public-visibility filters."
